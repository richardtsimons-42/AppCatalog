services:
  api:
    build: ./AppCatalog.Api
    ports:
      - "5001:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=AppCatalog;User Id=sa;Password=MyStr0ngP@ssw0rd123;TrustServerCertificate=True;
      - TokenSettings__Secret=YourSuperSecretKeyThatIsAtLeast32CharactersLong!
      - TokenSettings__Issuer=AppCatalog
      - TokenSettings__Audience=AppCatalogUsers
      - TokenSettings__ExpiryMinutes=60
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      sqlserver:
        condition: service_started
    restart: unless-stopped

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1435:1433"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=MyStr0ngP@ssw0rd123
      - MSSQL_PID=Developer
    volumes:
      - sqlserver-data:/var/opt/mssql
    restart: unless-stopped

volumes:
  sqlserver-data:
